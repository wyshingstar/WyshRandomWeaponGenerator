<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
  <title>Wysh's Random Weapon Generator</title>
</head>
<body>
 <div class="container">
    
    <div class="title">Wysh's Random Weapon Generator</div>
   <img src="Legendaryweapons.jpg" alt="Weapons by Wysh">

    <div class="button-container"><button onclick="generateWeaponWithAnimation(0)">Type</button><span class="number" id="num0"></span></div>
    <div class="button-container"><button onclick="generateWeaponWithAnimation(1)">Size</button><span class="number" id="num1"></span></div>
    <div class="button-container"><button onclick="generateWeaponWithAnimation(2)">Age</button><span class="number" id="num2"></span></div>
    <div class="button-container"><button onclick="generateWeaponWithAnimation(3)">Material</button><span class="number" id="num3"></span></div>
    <div class="button-container"><button onclick="generateWeaponWithAnimation(4)">Element</button><span class="number" id="num4"></span></div>
    <div class="button-container"><button onclick="generateWeaponWithAnimation(5)">Style</button><span class="number" id="num5"></span></div>
    <div class="button-container"><button onclick="generateWeaponWithAnimation(6)">Extra</button><span class="number" id="num6"></span></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
